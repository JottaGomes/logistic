@if (!isAuthPage) {
  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="DACHSER Intelligent Logistics" />
      </div>
      <nav>
        <a class="nav-item" routerLink="/calculate-profit" routerLinkActive="active">
          <mat-icon>paid</mat-icon>
          <span>Calculate Profit</span>
        </a>
        <a class="nav-item" routerLink="/record-data" routerLinkActive="active">
          <mat-icon>edit_note</mat-icon>
          <span>Record Data</span>
        </a>
      </nav>
      <div class="sidebar-foot">Income &amp; Cost Evaluation</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1>{{ pageTitle }}</h1>
        <div class="topbar-right">
          @if (authService.loginEnabled) {
            <span class="user">
              <mat-icon>account_circle</mat-icon>
              {{ authService.getUsername() }}
            </span>
            <button mat-icon-button (click)="logout()" title="Log out" aria-label="Log out">
              <mat-icon>logout</mat-icon>
            </button>
          } @else {
            <span class="badge">Authentication off</span>
          }
        </div>
      </header>

      <main class="content">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
